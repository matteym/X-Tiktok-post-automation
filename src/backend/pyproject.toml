[project]
name = "content-autopilot"
version = "0.1.0"
requires-python = ">=3.11"
description = "Content autopilot CLI for X/TikTok post automation"
dependencies = [
    "typer>=0.12",
    "langgraph>=0.2",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]
scripts = { content-autopilot = "content_autopilot.cli:main" }

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_autopilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
link-mode = "copy"
