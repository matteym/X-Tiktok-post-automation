[project]
name = "content-autopilot"
version = "0.1.0"
description = "CLI for automated X and TikTok content publishing"
requires-python = ">=3.12"
dependencies = [
    "langgraph",
    "langchain-core",
    "pydantic-settings",
    "typer",
    "sqlalchemy",
    "httpx",
    "python-dotenv",
]

[project.scripts]
content-autopilot = "content_autopilot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/content_autopilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
