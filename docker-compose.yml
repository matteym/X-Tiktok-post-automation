# yarn task adds services. Copy composeBlock/envBlock in this file (postgres, redis, mongodb, neo4j, mysql).
services:
  postgres:
    image: postgres:16-alpine
    ports:
      # Host 5433 avoids clashing with a local Windows postgres.exe on 5432.
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
